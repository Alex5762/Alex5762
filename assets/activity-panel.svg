<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="t d"><title id="t">GitHub activity panel</title><desc id="d">A compact contribution-style activity visualization using static SVG cells.</desc><rect width="1000" height="180" rx="14" fill="#090909" stroke="#292929"/><g font-family="monospace"><text x="28" y="34" font-size="12" fill="#FFD23F" letter-spacing="2">GITHUB ACTIVITY // CONTRIBUTION MATRIX</text><text x="28" y="57" font-size="10" fill="#666">PROJECTS · STUDIES · EXPERIMENTATION</text><g transform="translate(28 78)"><!-- 12 x 7 matrix --><g fill="#1C1C1C">"