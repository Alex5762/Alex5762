<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Joseph Alexsander — perfil hacker verde</title>
  <desc id="desc">Banner animado em preto e verde neon com chuva digital e terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010402"/>
      <stop offset="0.5" stop-color="#031108"/>
      <stop offset="1" stop-color="#061b0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#00ff66" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#00ff66" stroke-opacity=".08"/>
    </pattern>
    <filter id="glowFx" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .rain{font-family:monospace;font-size:17px;fill:#22c55e;opacity:.34;animation:fall 4s linear infinite}.r2{animation-delay:-1.5s}.r3{animation-delay:-2.8s}.blink{animation:blink 1s steps(1) infinite}.scan{animation:scan 4s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes fall{0%{transform:translateY(-180px)}100%{transform:translateY(430px)}}@keyframes blink{50%{opacity:0}}@keyframes scan{0%{transform:translateY(-20px);opacity:0}12%,88%{opacity:.6}100%{transform:translateY(380px);opacity:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="600" cy="175" rx="520" ry="220" fill="url(#glow)"/>
  <g aria-hidden="true">
    <text class="rain" x="65" y="0">0101010011010010101010110010</text>
    <text class="rain r2" x="245" y="-80">1010011010010110100101011101</text>
    <text class="rain r3" x="885" y="-20">0010110101001011010100110101</text>
    <text class="rain r2" x="1040" y="-110">1101001011010010110101010011</text>
  </g>
  <g class="scan"><rect x="35" y="0" width="1130" height="2" fill="#4ade80" opacity=".65" filter="url(#glowFx)"/></g>
  <rect x="218" y="66" width="764" height="224" rx="16" fill="#020604" fill-opacity=".88" stroke="#16a34a" stroke-opacity=".75"/>
  <circle cx="246" cy="91" r="6" fill="#22c55e" class="pulse"/>
  <circle cx="268" cy="91" r="6" fill="#15803d"/>
  <circle cx="290" cy="91" r="6" fill="#14532d"/>
  <text x="330" y="98" fill="#86efac" font-family="monospace" font-size="14">~/profile/joseph</text>
  <text x="255" y="148" fill="#4ade80" font-family="monospace" font-size="20">$ whoami</text>
  <text x="600" y="198" text-anchor="middle" fill="#dcfce7" font-family="Verdana,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="2" filter="url(#glowFx)">JOSEPH ALEXSANDER</text>
  <text x="600" y="238" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="19">ADS | IA | AUTOMAÇÃO | DESENVOLVIMENTO WEB</text>
  <text x="255" y="270" fill="#86efac" font-family="monospace" font-size="16">$ status --current: construindo soluções reais<span class="blink">_</span></text>
</svg>