<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Joseph Alexsander — Argus Black inspired profile</title>
<desc id="desc">Dark technical interface with animated grid, scanning line and system indicators.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#111111"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#262626" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" fill="url(#bg)" rx="18"/>
<rect x="18" y="18" width="1164" height="324" rx="12" fill="url(#grid)" opacity=".42"/>
<path d="M0 270H1200" stroke="#FFD23F" stroke-opacity=".12"/>
<path d="M70 0V360M1130 0V360" stroke="#FFD23F" stroke-opacity=".10"/>
<g font-family="monospace" fill="#FFD23F"><text x="58" y="58" font-size="13" letter-spacing="3">ARGUS // PROFILE NODE</text><text x="58" y="82" font-size="10" fill="#888">SYSTEM STATUS: ONLINE</text></g>
<g font-family="Arial, sans-serif" fill="#F5F5F5"><text x="58" y="185" font-size="58" font-weight="800" letter-spacing="5">JOSEPH</text><text x="58" y="244" font-size="58" font-weight="800" letter-spacing="5">ALEXSANDER</text></g>
<text x="61" y="280" font-family="monospace" font-size="14" fill="#A3A3A3" letter-spacing="2">WEB  /  AI  /  DATA  /  SOFTWARE</text>
<g transform="translate(930 82)" font-family="monospace" font-size="10" fill="#888"><text y="0">NODE_01</text><text y="24">BUILDING</text><text y="48">TESTING</text><text y="72">REFINING</text></g>
<g filter="url(#glow)"><circle cx="1085" cy="84" r="5" fill="#FFD23F"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle></g>
<path d="M28 315H1172" stroke="#FFD23F" stroke-width="2" opacity=".55"><animate attributeName="x1" values="28;1172;28" dur="7s" repeatCount="indefinite"/></path>
<text x="58" y="322" font-family="monospace" font-size="9" fill="#555">BUILD → TEST → REFINE</text>
</svg>