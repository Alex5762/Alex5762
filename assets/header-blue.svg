<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Joseph Alexsander — perfil de tecnologia</title>
  <desc id="desc">Banner azul animado com grade digital, sequência de inicialização e apresentação profissional sem textos sobrepostos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#071a3d"/>
      <stop offset="1" stop-color="#0b3b70"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" stop-opacity=".92"/>
      <stop offset="1" stop-color="#082f49" stop-opacity=".76"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#38bdf8" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .orb{animation:float 5s ease-in-out infinite;transform-origin:center}.orb.b{animation-delay:-2.3s}.scan{animation:scan 5s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.dash{stroke-dasharray:12 18;animation:dash 7s linear infinite}.boot1,.boot2,.boot3,.boot4{opacity:0}.boot1{animation:line1 8s linear infinite}.boot2{animation:line2 8s linear infinite}.boot3{animation:line3 8s linear infinite}.boot4{animation:line4 8s linear infinite}.cursor{animation:blink 1s steps(2,end) infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes scan{0%{transform:translateY(-40px);opacity:0}10%,90%{opacity:.7}100%{transform:translateY(470px);opacity:0}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-300}}@keyframes line1{0%,21%{opacity:1}22%,100%{opacity:0}}@keyframes line2{0%,24%{opacity:0}25%,46%{opacity:1}47%,100%{opacity:0}}@keyframes line3{0%,49%{opacity:0}50%,71%{opacity:1}72%,100%{opacity:0}}@keyframes line4{0%,74%{opacity:0}75%,100%{opacity:1}}@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="24" fill="url(#grid)"/>
  <ellipse cx="600" cy="160" rx="510" ry="215" fill="url(#glow)"/>
  <circle class="orb" cx="108" cy="82" r="4" fill="#7dd3fc" filter="url(#softGlow)"/>
  <circle class="orb b" cx="1070" cy="95" r="5" fill="#60a5fa" filter="url(#softGlow)"/>
  <circle class="pulse" cx="1020" cy="260" r="3" fill="#bae6fd"/>
  <circle class="pulse" cx="172" cy="250" r="3" fill="#93c5fd"/>
  <path class="dash" d="M55 386 C300 336 390 426 610 378 S945 332 1145 382" fill="none" stroke="#38bdf8" stroke-opacity=".48" stroke-width="2"/>
  <g class="scan"><rect x="32" y="0" width="1136" height="2" fill="#7dd3fc" opacity=".65" filter="url(#softGlow)"/></g>

  <text x="600" y="103" text-anchor="middle" fill="#e0f2fe" font-family="Verdana,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="2">JOSEPH ALEXSANDER</text>
  <text x="600" y="147" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="20" letter-spacing="3">ADS • IA • DADOS • DESENVOLVIMENTO WEB</text>
  <text x="600" y="187" text-anchor="middle" fill="#cbd5e1" font-family="Verdana,Arial,sans-serif" font-size="16">Construindo projetos reais, aprendendo continuamente e transformando ideias em soluções.</text>

  <rect x="260" y="225" width="680" height="96" rx="16" fill="url(#panel)" stroke="#38bdf8" stroke-opacity=".55"/>
  <circle cx="285" cy="247" r="5" fill="#ef4444"/>
  <circle cx="303" cy="247" r="5" fill="#f59e0b"/>
  <circle cx="321" cy="247" r="5" fill="#22c55e"/>
  <text x="345" y="252" fill="#7dd3fc" font-family="monospace" font-size="13">profile_boot.log</text>
  <rect x="284" y="266" width="632" height="36" rx="9" fill="#020617" fill-opacity=".82" stroke="#0ea5e9" stroke-opacity=".35"/>

  <text class="boot1" x="600" y="290" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="14">[ OK ] carregando perfil e contexto profissional...</text>
  <text class="boot2" x="600" y="290" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="14">[ OK ] conectando estudos, projetos e experiência prática...</text>
  <text class="boot3" x="600" y="290" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="14">[ OK ] verificando missão e objetivos atuais...</text>
  <text class="boot4" x="600" y="290" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="14">[ READY ] sistema pronto: open_to_opportunities<tspan class="cursor">_</tspan></text>

  <rect x="430" y="343" width="340" height="34" rx="17" fill="#020617" fill-opacity=".8" stroke="#38bdf8" stroke-opacity=".62"/>
  <text x="600" y="365" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="14">status: evoluindo um commit de cada vez<tspan class="cursor">_</tspan></text>
</svg>