<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Joseph Alexsander — perfil hacker verde V2</title>
  <desc id="desc">Banner animado em preto e verde neon com chuva Matrix, boot sequencial, scanner, circuitos e glitch leve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010402"/>
      <stop offset=".48" stop-color="#031108"/>
      <stop offset="1" stop-color="#071d0e"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="49%" r="56%">
      <stop offset="0" stop-color="#00ff66" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#00d957" stop-opacity=".10"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGradient" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="950" y2="0">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset=".42" stop-color="#dcfce7"/>
      <stop offset=".5" stop-color="#86efac"/>
      <stop offset=".58" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#dcfce7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-260 0;260 0;-260 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#00ff66" stroke-opacity=".10"/>
    </pattern>
    <filter id="glowFx" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip"><rect x="196" y="46" width="808" height="284" rx="18"/></clipPath>
    <style>
      .rain{font-family:monospace;font-size:18px;fill:#4ade80;opacity:.52;animation:fall 4.6s linear infinite}
      .fast{animation-duration:3.2s}.slow{animation-duration:6.1s}.d1{animation-delay:-.8s}.d2{animation-delay:-1.7s}.d3{animation-delay:-2.9s}.d4{animation-delay:-4.1s}
      .scan{animation:scan 3s linear infinite}.pulse{animation:pulse 2.1s ease-in-out infinite}.core{transform-origin:600px 190px;animation:core 3.8s ease-in-out infinite}
      .panel{animation:borderPulse 2.2s ease-in-out infinite}.circuit{stroke-dasharray:10 14;animation:dash 5s linear infinite}
      .boot{opacity:0;animation:boot 7s ease-in-out infinite}.b1{animation-delay:.2s}.b2{animation-delay:1.1s}.b3{animation-delay:2s}
      .glitchA,.glitchB{opacity:0;animation:glitch 5.5s steps(1) infinite}.glitchB{animation-delay:.08s}
      .blink{animation:blink .85s steps(1) infinite}.node{animation:node 2.4s ease-in-out infinite}.n2{animation-delay:-1.2s}
      @keyframes fall{0%{transform:translateY(-340px)}100%{transform:translateY(620px)}}
      @keyframes scan{0%{transform:translateY(-24px);opacity:0}10%,90%{opacity:.85}100%{transform:translateY(405px);opacity:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes core{0%,100%{transform:scale(.94);opacity:.58}50%{transform:scale(1.08);opacity:1}}
      @keyframes borderPulse{0%,100%{stroke-opacity:.48}50%{stroke-opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-240}}
      @keyframes boot{0%,8%{opacity:0;transform:translateX(-7px)}13%,76%{opacity:1;transform:translateX(0)}86%,100%{opacity:0}}
      @keyframes glitch{0%,88%,92%,100%{opacity:0;transform:translate(0)}89%{opacity:.72;transform:translate(-4px,1px)}90%{opacity:.48;transform:translate(5px,-1px)}91%{opacity:.62;transform:translate(-2px,0)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes node{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1.25)}}
    </style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <ellipse class="core" cx="600" cy="190" rx="535" ry="230" fill="url(#coreGlow)"/>

  <g clip-path="url(#panelClip)" aria-hidden="true">
    <text class="rain fast d1" x="32" y="-120">0101100101011010010110100101101001</text>
    <text class="rain slow d3" x="130" y="-250">1010011010110010100110101100101001</text>
    <text class="rain d2" x="245" y="-70">0010110101001011010100110101011010</text>
    <text class="rain fast d4" x="355" y="-310">1101001011010010110101010011010101</text>
    <text class="rain slow d1" x="470" y="-160">0101101010010110100101101010010110</text>
    <text class="rain d3" x="575" y="-290">1011010010110100101101001011010010</text>
    <text class="rain fast d2" x="685" y="-105">0011010101101001011010010110100101</text>
    <text class="rain slow d4" x="800" y="-230">1100101011010010110100101101001011</text>
    <text class="rain d1" x="910" y="-35">0101011010010110100101101001011010</text>
    <text class="rain fast d3" x="1015" y="-275">1010010110100101101001011010010110</text>
  </g>

  <path class="circuit" d="M42 318H160L190 288H238" fill="none" stroke="#22c55e" stroke-opacity=".55" stroke-width="2"/>
  <path class="circuit" d="M958 88H1042L1072 118H1158" fill="none" stroke="#22c55e" stroke-opacity=".55" stroke-width="2"/>
  <circle class="node" cx="160" cy="318" r="5" fill="#4ade80" filter="url(#glowFx)"/>
  <circle class="node n2" cx="1042" cy="88" r="5" fill="#4ade80" filter="url(#glowFx)"/>

  <g class="scan"><rect x="26" y="0" width="1148" height="3" fill="#86efac" opacity=".82" filter="url(#glowFx)"/></g>

  <rect class="panel" x="196" y="46" width="808" height="284" rx="18" fill="#020604" fill-opacity=".87" stroke="#22c55e" stroke-width="2" filter="url(#softGlow)"/>
  <rect x="213" y="63" width="774" height="250" rx="12" fill="none" stroke="#14532d" stroke-opacity=".65"/>

  <circle cx="228" cy="79" r="6" fill="#22c55e" class="pulse"/>
  <circle cx="250" cy="79" r="6" fill="#15803d"/>
  <circle cx="272" cy="79" r="6" fill="#14532d"/>
  <text x="312" y="86" fill="#86efac" font-family="monospace" font-size="14">root@joseph:~/profile</text>
  <text x="914" y="86" fill="#4ade80" font-family="monospace" font-size="13">LIVE</text>
  <circle class="pulse" cx="968" cy="81" r="5" fill="#22c55e" filter="url(#glowFx)"/>

  <text class="boot b1" x="235" y="124" fill="#4ade80" font-family="monospace" font-size="15">[ OK ] identity loaded</text>
  <text class="boot b2" x="235" y="149" fill="#4ade80" font-family="monospace" font-size="15">[ OK ] projects mounted</text>
  <text class="boot b3" x="235" y="174" fill="#4ade80" font-family="monospace" font-size="15">[ OK ] learning mode active</text>

  <text class="glitchA" x="600" y="229" text-anchor="middle" fill="#22c55e" font-family="Verdana,Arial,sans-serif" font-size="45" font-weight="700" letter-spacing="2">JOSEPH ALEXSANDER</text>
  <text class="glitchB" x="600" y="229" text-anchor="middle" fill="#67e8f9" font-family="Verdana,Arial,sans-serif" font-size="45" font-weight="700" letter-spacing="2">JOSEPH ALEXSANDER</text>
  <text x="600" y="229" text-anchor="middle" fill="url(#titleGradient)" font-family="Verdana,Arial,sans-serif" font-size="45" font-weight="700" letter-spacing="2" filter="url(#glowFx)">JOSEPH ALEXSANDER</text>
  <text x="600" y="264" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="18">ADS | IA | AUTOMAÇÃO | DESENVOLVIMENTO WEB</text>

  <rect x="235" y="282" width="730" height="30" rx="8" fill="#031108" stroke="#166534" stroke-opacity=".7"/>
  <text x="253" y="303" fill="#bbf7d0" font-family="monospace" font-size="15">$ status --current: construindo soluções reais<tspan class="blink">_</tspan></text>
</svg>